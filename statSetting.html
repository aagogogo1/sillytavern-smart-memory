<div class="stat-setting-content">
    <!-- 启用开关 -->
    <div class="setting-item">
        <label>
            <input type="checkbox" id="stats_manager_enabled" checked />
            启用状态管理
        </label>
        <small>启用后，AI会分析角色的状态值变化（如生命值、法力值等）</small>
    </div>

    <hr class="sysHR">
    
    <div class="stat-header">
        <h3>状态管理设置</h3>
        <button class="btn-primary" id="addStatBtn">添加状态</button>
    </div>
    
    <div class="stats-container" id="statsContainer">
        <!-- 状态列表将在这里动态生成 -->
    </div>
    
    <div class="prompt-preview-section">
        <h4>提示词预览</h4>
        <div class="prompt-preview-content" id="promptPreview">
            <!-- 提示词预览将在这里动态生成 -->
        </div>
    </div>
    
    <div class="setting-buttons">
        <small style="color: #666; text-align: center; margin-bottom: 10px; display: block;">
            点击"保存配置"将状态监控提示词自动添加到主页面总结提示词中
        </small>
        <button class="btn-primary" id="saveStatsBtn">保存配置</button>
        <button class="btn-secondary" id="exportStatsBtn">导出配置</button>
        <button class="btn-secondary" id="importStatsBtn">导入配置</button>
        <button class="btn-secondary" id="loadDefaultStatsBtn">恢复默认</button>
    </div>

    <!-- 隐藏的文件输入元素 -->
    <input type="file" id="importFileInput" accept=".json" style="display: none;">
</div>
